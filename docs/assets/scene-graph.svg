<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">GLB scene graph transform flow</title>
  <desc id="desc">The active scene and nested node transforms are combined before mesh instances become world-space geometry.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64d3eb"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="18" fill="#0b1020"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="35" y="92" width="170" height="96" rx="14" fill="#18233f" stroke="#64d3eb" stroke-width="2"/>
    <text x="120" y="126" fill="#e8eefc" font-size="19" font-weight="700">Active scene</text>
    <text x="120" y="153" fill="#9fb1cf" font-size="15">root nodes</text>
    <text x="120" y="174" fill="#9fb1cf" font-size="15">mesh instances</text>

    <rect x="275" y="92" width="190" height="96" rx="14" fill="#18233f" stroke="#64d3eb" stroke-width="2"/>
    <text x="370" y="126" fill="#e8eefc" font-size="19" font-weight="700">Node hierarchy</text>
    <text x="370" y="153" fill="#9fb1cf" font-size="15">translation</text>
    <text x="370" y="174" fill="#9fb1cf" font-size="15">rotation + scale</text>

    <rect x="535" y="92" width="175" height="96" rx="14" fill="#18233f" stroke="#64d3eb" stroke-width="2"/>
    <text x="622" y="126" fill="#e8eefc" font-size="19" font-weight="700">World matrix</text>
    <text x="622" y="153" fill="#9fb1cf" font-size="15">parent x local</text>
    <text x="622" y="174" fill="#9fb1cf" font-size="15">winding checked</text>

    <rect x="780" y="72" width="145" height="136" rx="14" fill="#18352f" stroke="#55d7a5" stroke-width="2"/>
    <text x="852" y="111" fill="#e8fff6" font-size="19" font-weight="700">World-space</text>
    <text x="852" y="139" fill="#b6dacd" font-size="15">positions, scale,</text>
    <text x="852" y="161" fill="#b6dacd" font-size="15">placement, and</text>
    <text x="852" y="183" fill="#b6dacd" font-size="15">instances preserved</text>

    <path d="M205 140 H270" stroke="#64d3eb" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M465 140 H530" stroke="#64d3eb" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M710 140 H775" stroke="#64d3eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="480" y="244" fill="#788aa8" font-size="15">Transforms are baked once before clustering and export.</text>
  </g>
</svg>
